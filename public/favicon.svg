<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Justin Funk">
  <!-- A patched port: the site's signature mark, reduced to its smallest
       legible form. Copper fill matches the "hands-on" state in the platform
       matrix. Colors are hardcoded rather than themed because favicons render
       outside the page's CSS. -->
  <rect width="32" height="32" fill="#0B1017" />
  <!-- Trunk and elbow, the routing-diagram language from the hero. -->
  <path d="M7 6 v14 h8" stroke="#93A1B2" stroke-width="2" fill="none" stroke-linecap="square" />
  <!-- The jack, seated. -->
  <circle cx="21" cy="20" r="5" fill="#F0A94C" />
</svg>
